<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Karlo Diaz — director, editor and 3D artist.">
  <title>Karlo Diaz — Director & Editor</title>
  <link rel="preconnect" href="https://api.fontshare.com">
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="intro" class="intro" aria-hidden="true">
    <video id="intro-video" muted playsinline preload="auto"></video>
  </div>

  <div class="page-transition" aria-hidden="true">
    <p class="page-transition-title"></p>
  </div>

  <header class="site-header">
    <a class="identity" href="#about" aria-label="Karlo Diaz, home">
      <span>Karlo Diaz</span>
      <img src="xtralogo.png" alt="XTRA logo">
    </a>
    <nav aria-label="Primary navigation">
      <a href="#about" class="nav-link">About</a>
      <a href="#works" class="nav-link">Works</a>
      <a href="#contact" class="nav-link">Contact</a>
    </nav>
  </header>

  <main>
    <section id="about" class="hero section">
      <div class="hero-kicker reveal">Director · Editor · 3D Artist</div>
      <h1 class="hero-name reveal">Karlo<br>Diaz</h1>
      <div class="hero-bottom reveal">
        <p>Studying Digital and Media Arts with a minor in Video & Film Production at CSUSM.</p>
        <a href="#works" class="text-link">View selected work <span>↓</span></a>
      </div>
    </section>

    <section id="works" class="works section">
      <div class="section-heading reveal">
        <p>Selected work</p>
        <p>2023—2026</p>
      </div>
      <div id="project-list" class="project-list"></div>
    </section>

    <section id="contact" class="contact section">
      <img class="contact-logo" src="xtralogo.png" alt="" aria-hidden="true">
      <div class="contact-inner reveal">
        <p class="contact-label">Contact</p>
        <h2>Ready when<br>you are.</h2>
        <a class="contact-email" href="mailto:karloxtra@gmail.com">karloxtra@gmail.com</a>
      </div>
      <div class="contact-links reveal">
        <a href="https://www.instagram.com/xtrazaid/" target="_blank" rel="noopener">Instagram</a>
        <a href="https://www.linkedin.com/in/karlo-diaz-78ba50371/" target="_blank" rel="noopener">LinkedIn</a>
      </div>
    </section>
  </main>

  <script src="projects.js"></script>
  <script src="script.js"></script>
</body>
</html>
