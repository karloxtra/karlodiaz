<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Karlo Diaz — director, editor, and 3D artist.">
  <title>KARLO DIAZ</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="home-page">
  <div id="intro" class="intro" aria-hidden="true">
    <video id="intro-video" muted playsinline preload="auto"></video>
  </div>

  <header class="site-header">
    <button class="brand-link" data-section="about" type="button" aria-label="Go to About">
      <img src="xtralogo.png" alt="XTRA">
    </button>
    <nav class="main-nav" aria-label="Primary navigation">
      <button class="nav-link is-active" data-section="about" type="button">ABOUT</button>
      <button class="nav-link" data-section="works" type="button">WORKS</button>
      <button class="nav-link" data-section="contact" type="button">CONTACT</button>
    </nav>
  </header>

  <main>
    <section id="about" class="page-section about-section is-active" aria-labelledby="about-name">
      <div class="about-lockup">
        <h1 id="about-name">KARLO DIAZ</h1>
        <p>DIRECTOR · EDITOR · 3D ARTIST</p>
        <p class="education">DIGITAL AND MEDIA ARTS MAJOR<br>MINOR IN VIDEO &amp; FILM PRODUCTION<br>CALIFORNIA STATE UNIVERSITY SAN MARCOS</p>
      </div>
      <button class="scroll-cue" data-section="works" type="button">SELECTED WORK ↓</button>
    </section>

    <section id="works" class="page-section works-section" aria-labelledby="works-title">
      <div class="section-heading">
        <h2 id="works-title">SELECTED WORK</h2>
        <span>2023—2026</span>
      </div>
      <div id="projects-grid" class="projects-grid"></div>
    </section>

    <section id="contact" class="page-section contact-section" aria-labelledby="contact-title">
      <img class="contact-mark" src="xtralogo.png" alt="" aria-hidden="true">
      <div class="contact-inner">
        <p class="contact-kicker">AVAILABLE FOR SELECT PROJECTS</p>
        <h2 id="contact-title">READY WHEN<br>YOU ARE.</h2>
        <a class="contact-email" href="mailto:karloxtra@gmail.com">KARLOXTRA@GMAIL.COM</a>
        <div class="contact-links">
          <a href="https://www.instagram.com/xtrazaid/" target="_blank" rel="noopener">INSTAGRAM</a>
          <a href="https://www.linkedin.com/in/karlo-diaz-78ba50371/" target="_blank" rel="noopener">LINKEDIN</a>
        </div>
      </div>
    </section>
  </main>

  <div class="page-transition" aria-hidden="true"><span></span></div>

  <script src="projects.js"></script>
  <script src="script.js"></script>
</body>
</html>
